<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Idea Generation Study 2025-06">
    <script src="https://unpkg.com/jspsych@8.2.1"></script>
    <title>Idea generation Study 2025-06</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <h1>Idea Generation Study</h1>
        <p class="centered">自動的に調査ページへとリダイレクトします<br> 移動しない場合は，下のリンクをクリックしてください。</p>
        <p class="centered"><a id="dymamic-link" href="#">調査ページへのリンク</a></p>
    </div>

    <script type="module">
        import { baseURL, redirect } from './settings.js';
        import { getSurveyLink, setCookie, getCookie } from '../mysurvey.js'; // setCookieとgetCookieをインポート

        const jsPsych = initJsPsych();
        let ccode;

        // Cookieから既存のccodeを取得
        const existingCcode = getCookie('ccode');

        if (existingCcode) {
            // Cookieにccodeが存在する場合、それを使用する
            ccode = existingCcode;
            console.log("既存の完了コードを再利用します:", ccode);
        } else {
            // Cookieにccodeが存在しない場合、新しいccodeを生成し、Cookieに保存する
            ccode = jsPsych.randomization.randomID(10);
            setCookie('ccode', ccode, 1); // 1日間有効なCookieとして保存
            console.log("新しい完了コードを生成し、保存しました:", ccode);
        }

        // URLを生成
        const fullURL = getSurveyLink(baseURL, ccode);

        // <a>要素のhref属性を設定
        const linkElement = document.getElementById("dymamic-link");
        linkElement.setAttribute("href", fullURL);

        // リダイレクトを実行
        const redirectDelay = 1000; // 1秒
        if (redirect) {
            setTimeout(() => {
                window.location.href = fullURL;
            }, redirectDelay);
        } else {
            console.log(`Redirect is disabled. Click the link to go to the survey: ${fullURL}`);
        }
    </script>
</body>
</html>
