<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Idea Generation Study 2025-06">
    <script src="https://unpkg.com/jspsych@8.2.1"></script>
    <title>Belief Study 2025-06</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <h1>Idea Generation Study</h1>
    <p class="centered">自動的に調査ページへとリダイレクトします<br> 移動しない場合は，下のリンクをクリックしてください。</p>
    <p class="centered"><a id="dymamic-link" href="#">調査ページへのリンク</a></p>
    <!-- <script src="./settings.js"></script> -->
    <!-- <script src="../mysurvey.js"></script> -->
    <script type="module">
        // settings.jsとmysurvey.jsをインポート
        import { baseURL, redirect } from './settings.js';
        import { getSurveyLink } from '../mysurvey.js';

        // const ccode = getCcode(); mysurvey.jsで定義されている関数を使用
        const jsPsych = initJsPsych();
        const ccode = jsPsych.randomization.randomID(10); // jsPsychのランダムID生成関数を使用

        // URLを生成
        const fullURL = getSurveyLink(baseURL, ccode);
        // <a>要素のhref属性を設定
        const linkElement = document.getElementById("dymamic-link");
        linkElement.setAttribute("href", fullURL);

        // リダイレクトを実行
        // 1秒後にリダイレクト
        const redirectDelay = 1000; // 1秒
        if (redirect) {
            setTimeout(() => {
                window.location.href = fullURL;
            }, redirectDelay);
        } else {
            console.log(`Redirect is disabled. Click the link to go to the survey: ${fullURL}`);
        }
    </script>
</body>
</html>
