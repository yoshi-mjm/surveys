<body>
    <h1>Belief Study</h1>
    <p class="centered">自動的に調査ページへとリダイレクトします<br> 移動しない場合は，下のリンクをクリックしてください。</p>
    <p class="centered"><a id="dymamic-link" href="#">調査ページへのリンク</a></p>
    <script src="./settings.js"></script>
    <script src="../mysurvey.js"></script>
    <script type="text/javascript">
        import { baseURL } from './settings.js';

        // ccodeが存在する場合、URLを生成してリダイレクト
        const ccode = getCcode();
        let fullURL;
        if (ccode) {
            fullURL = `https://jp.surveymonkey.com/r/YYT573P?ccode=${ccode}`;
        } else {
            // ccodeが存在しない場合、デフォルトのURLを使用
            fullURL = "https://jp.surveymonkey.com/r/YYT573P";
        }
        const linkElement = document.getElementById("dymamic-link");
        linkElement.setAttribute("href", fullURL);
        // リダイレクトを実行
        // 1秒後にリダイレクト
        setTimeout(() => {
            window.location.href = fullURL;
        }, 1000); // 1秒後にリダイレクト    
        /* window.location.href = fullURL; 
        // リダイレクトまでの時間を設定（ミリ秒）

    </script>
